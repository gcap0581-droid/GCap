<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Shield Shape -->
  <path d="M256 96 L376 144 V248 C376 328 324 396 256 424 C188 396 136 328 136 248 V144 Z" 
        fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-width="6" />

  <!-- Trending Up Arrow & Coin Symbol -->
  <circle cx="256" cy="256" r="88" fill="url(#coinGrad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="76" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.5" />

  <!-- Currency / Capital "G" / Rupee glyph -->
  <text x="256" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" fill="#ffffff" text-anchor="middle">₹</text>

  <!-- Growth Sparkle Badge -->
  <circle cx="360" cy="152" r="28" fill="#34d399" />
  <path d="M360 134 L364 148 L378 152 L364 156 L360 170 L356 156 L342 152 L356 148 Z" fill="#022c22" />
</svg>
